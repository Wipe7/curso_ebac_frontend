<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Gerador de Senhas</title>
        <link rel="stylesheet" href="./dist/styles/main.min.css">
    </head>
    <body>
        <div class="container">
            <h1>Gerador de Senhas Aleatórias</h1>
            <label for="comprimento-senha">Comprimento da Senha:</label>
            <input type="number" id="comprimento-senha" min="4" max="12" value="8">
            <div class="checkbox-container">
                <label>
                    <input type="checkbox" id="incluir-numeros" checked="checked">
                    Incluir Números
                </label>
                <label>
                    <input type="checkbox" id="incluir-maiusculas" checked="checked">
                    Incluir Letras Maiúsculas
                </label>
                <label>
                    <input type="checkbox" id="incluir-especiais">
                    Incluir Caracteres Especiais
                </label>
            </div>
        
            <button id="botao-gerar">Gerar Senha</button>
            <p id="senha-gerada"></p>
        </div>
        
        </div>
        <footer>
            <p>Desenvolvido por <strong>Will7L</strong></p>
        </footer>
        <script src="./dev/scripts/main.min.js"></script>
    </body>
</html>
